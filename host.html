<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeopardy Host Control Console</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

  <!-- 1. Setup Panel Overlay -->
  <div id="setup-container" class="setup-panel glass">
    <h1 style="text-align: center; margin-bottom: 24px; color: var(--color-accent);">Jeopardy Setup Console</h1>
    
    <!-- Game Board File Upload -->
    <div class="form-group">
      <label for="csv-upload">Upload Game Board CSV</label>
      <input type="file" id="csv-upload" accept=".csv" style="display: none;">
      <button class="btn" id="csv-upload-trigger" style="width: 100%; justify-content: center;">
        Choose Game Board CSV
      </button>
      <p id="upload-status" style="margin-top: 8px; font-size: 14px; color: var(--color-text-muted); text-align: center; font-style: italic;">No file selected.</p>
    </div>

    <!-- Dynamic Teams selection -->
    <div class="form-group">
      <label for="teams-count">Number of Teams</label>
      <select id="teams-count">
        <option value="2">2 Teams</option>
        <option value="3" selected>3 Teams</option>
        <option value="4">4 Teams</option>
      </select>
    </div>

    <!-- Team Inputs Container -->
    <div id="team-setup-rows" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
      <!-- Dynamic Rows are drawn here -->
    </div>

    <button id="start-game-btn" class="btn btn-accent" style="width: 100%; justify-content: center; font-size: 16px; padding: 12px;" disabled>
      Start Game Session
    </button>
  </div>

  <!-- 2. Active Game Dashboard Layout -->
  <div id="active-game-container" style="display: none;" class="host-layout">
    
    <!-- Left Sidebar: Teams & Adjusters -->
    <aside id="host-sidebar">
      <h2 style="font-size: 20px; color: var(--color-accent); margin-bottom: 16px;">Host Panel</h2>
      
      <!-- Open Spectator Screen programmatic trigger -->
      <button class="btn btn-accent" id="open-board-btn" style="width: 100%; justify-content: center; margin-bottom: 16px;">
        Open Board Window
      </button>

      <h3 style="font-size: 14px; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 8px;">Scoreboards</h3>
      
      <!-- List of active teams for manual override -->
      <div id="host-team-list" class="team-list-sidebar">
        <!-- Rendered dynamically -->
      </div>

      <div style="margin-top: auto;">
        <button class="btn" id="reset-game-btn" style="width: 100%; justify-content: center; background: hsla(350, 89%, 60%, 0.1); border-color: hsla(350, 89%, 60%, 0.2); color: hsl(350, 89%, 75%);">
          Reset Game Session
        </button>
      </div>
    </aside>

    <!-- Main Board Console Area -->
    <main id="host-main">
      
      <!-- Header Dashboard controllers -->
      <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-glass);">
        <h2 id="host-round-title" style="font-size: 24px; text-transform: uppercase;">Single Jeopardy</h2>
        <div style="display: flex; gap: 10px;" id="round-actions-container">
          <button class="btn" id="btn-goto-double" style="display: none;">Next Round: Double Jeopardy</button>
          <button class="btn" id="btn-goto-final" style="display: none;">Next Round: Final Jeopardy</button>
          <button class="btn" id="btn-goto-complete" style="display: none;">Complete Game Session</button>
        </div>
      </header>

      <!-- Host grid cards grid view -->
      <div id="host-clue-grid" class="host-grid">
        <!-- Renders dynamically -->
      </div>

      <!-- Active Clue Host Control console -->
      <section id="host-clue-controller" class="host-control-drawer" style="display: none;">
        
        <div class="host-question-display">
          <h4 id="controller-category" style="font-size: 14px; text-transform: uppercase; color: var(--color-accent); margin-bottom: 4px;">Category</h4>
          <p id="controller-question" style="font-size: 18px; font-weight: 500;">Active clue prompt displayed here...</p>
          <p id="controller-answer" class="host-ans-reveal">Correct Answer: Mitochondria</p>
        </div>

        <!-- Daily Double Wagering Panel -->
        <div id="dd-wager-panel" class="glass" style="padding: 16px; border-radius: 8px; display: none;">
          <h4 style="margin-bottom: 10px; color: var(--color-accent);">Daily Double Wagering</h4>
          <div style="display: flex; gap: 10px; align-items: center;">
            <label for="dd-team-select">Wagering Team:</label>
            <select id="dd-team-select" style="width: auto; padding: 6px 12px; background: #000; border: 1px solid var(--border-glass); border-radius: 6px; color:#fff;"></select>
            
            <label for="dd-wager-input">Wager Amount:</label>
            <input type="text" id="dd-wager-input" placeholder="$ amount" style="width: 100px; padding: 6px; background: #000; border: 1px solid var(--border-glass); border-radius: 6px; color:#fff; text-align: center;">
            
            <button class="btn btn-accent" id="dd-submit-wager-btn" style="padding: 6px 16px;">Set Wager</button>
          </div>
        </div>

        <!-- Buzzer buttons claims triggers -->
        <div id="buzzer-action-panel">
          <h4 style="font-size: 14px; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 8px;">Buzzer Board Claim</h4>
          <div id="buzzer-teams-row" class="host-button-row">
            <!-- Dynamic buzzer trigger buttons -->
          </div>
        </div>

        <!-- Quick Score adjustment panel -->
        <div id="quick-score-panel" style="border-top: 1px solid var(--border-glass); padding-top: 16px;">
          <h4 style="font-size: 14px; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 8px;">Quick Score Assign</h4>
          <div id="quick-score-teams-row" class="host-button-row" style="display: flex; gap: 12px; flex-wrap: wrap;">
            <!-- Rendered dynamically: (+/- value) buttons per team -->
          </div>
        </div>

        <!-- Question Judging panels -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-glass); padding-top: 16px;">
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-correct" id="host-clue-correct-btn" disabled>Correct</button>
            <button class="btn btn-incorrect" id="host-clue-incorrect-btn" disabled>Incorrect</button>
          </div>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-accent" id="host-reveal-answer-btn">Reveal Answer</button>
            <button class="btn" id="host-clue-skip-btn">Skip / Nobody Answered</button>
          </div>
        </div>

      </section>

    </main>
  </div>

  <!-- State & Audio Script Links -->
  <script src="src/js/app.js"></script>
  <script src="src/js/audio.js"></script>
  <script src="src/js/host-ui.js"></script>
</body>
</html>
